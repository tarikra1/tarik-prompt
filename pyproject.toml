[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tarik-prompt"
version = "1.1.0"
description = "Bilingual (English/Arabic) strategic prompt engineering skill and model-aware XML/Markdown blueprint compiler for Claude, ChatGPT, and Gemini."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Tarik", email = "tarikra1@users.noreply.github.com" }
]
keywords = ["prompt-engineering", "claude", "chatgpt", "gemini", "arabic-nlp", "agent-skills", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tarikra1/tarik-prompt"
Repository = "https://github.com/tarikra1/tarik-prompt"
Changelog = "https://github.com/tarikra1/tarik-prompt/blob/main/CHANGELOG.md"
Issues = "https://github.com/tarikra1/tarik-prompt/issues"

[project.scripts]
tarik-prompt = "tarik_prompt.compiler:main"

[tool.setuptools.packages.find]
where = ["src"]
